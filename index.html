<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JobDeck - Job Management for Tradespeople</title>
    <meta name="description" content="Run your trade business without the paperwork. Create quotes, track jobs, and send invoices in seconds from your phone." />

    <!-- PWA meta -->
    <meta name="theme-color" content="#2B5DAE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JobDeck" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />

    <link rel="icon" href="/favicon.ico" />

    <!-- Sitewide social fallback (per-route Helmet replaces these for JS crawlers) -->
    <meta property="og:title" content="JobDeck — Job Management for Tradespeople" />
    <meta property="og:description" content="Run your trade business without the paperwork. Create quotes, track jobs, and send invoices in seconds from your phone." />
    <meta property="og:url" content="https://jobdeck.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JobDeck" />
    <meta name="twitter:card" content="summary" />

    <!-- Sitewide structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JobDeck",
        "url": "https://jobdeck.app/",
        "logo": "https://jobdeck.app/pwa-icon-512.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JobDeck",
        "url": "https://jobdeck.app/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "JobDeck",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Mobile-first job management for tradespeople — create quotes, track jobs, and send invoices in seconds.",
        "url": "https://jobdeck.app/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
